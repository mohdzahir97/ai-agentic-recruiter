services:
  postgres:
    image: postgres:16-alpine
    container_name: air-postgres
    environment:
      POSTGRES_USER: recruit
      POSTGRES_PASSWORD: recruit
      POSTGRES_DB: recruitment
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recruit -d recruitment"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - air-network
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: air-backend
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      # Inside Compose the database is reachable by service name, never
      # localhost. This overrides whatever .env says.
      DATABASE_URL: postgresql+psycopg://recruit:recruit@postgres:5432/recruitment
    ports:
      - "8000:8000"
    volumes:
      # Uploaded resumes and the Chroma store survive a container rebuild.
      - backend_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      # Generous: the first request downloads the local embedding model.
      start_period: 120s
    networks:
      - air-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Baked in at build time: NEXT_PUBLIC_* is inlined into the browser
        # bundle, so it cannot be set at runtime. The browser talks to the
        # published port on the host, not to the Compose service name.
        NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    container_name: air-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - air-network
    restart: unless-stopped

volumes:
  postgres_data:
  backend_data:

networks:
  air-network:
    driver: bridge
